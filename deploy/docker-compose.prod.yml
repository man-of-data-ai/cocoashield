# Stack de production CocoaShield — un seul VPS, un seul domaine public.
# Le web (Next.js) proxifie /v1/* vers l'API : seul Caddy est exposé.
# Prérequis sur le serveur : /opt/cocoashield/.env (copié depuis .env.example)
# et `docker login ghcr.io` si les images sont privées.
name: cocoashield

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    image: ghcr.io/man-of-data-ai/cocoashield-back:${BACK_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: cocoashield-back
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${DOMAIN}
      WEB_URL: https://${DOMAIN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads

  web:
    image: ghcr.io/man-of-data-ai/cocoashield-web:${WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - back
    environment:
      BACKEND_URL: http://back:3000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
