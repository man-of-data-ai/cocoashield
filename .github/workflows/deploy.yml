name: deploy

# Tout push sur `production` est une intention de déploiement : on construit
# les deux images (back + web) et on déploie la stack complète, sans filtre
# de chemins — contrairement à la CI de develop (back.yml / web.yml).
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: back
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-back
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
      - uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          # Cache sur GHCR plutôt que type=gha : le cache Actions n'est pas
          # lisible depuis une branche sœur, donc le build de production ne
          # retrouvait jamais celui chauffé par develop.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-back:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-back:buildcache,mode=max,ignore-error=true

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: web
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          # Cache sur GHCR plutôt que type=gha : le cache Actions n'est pas
          # lisible depuis une branche sœur, donc le build de production ne
          # retrouvait jamais celui chauffé par develop.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-web:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-web:buildcache,mode=max,ignore-error=true

  deploy:
    if: github.ref == 'refs/heads/production'
    needs: [build-back, build-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: deploy
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy/Caddyfile "$VPS_USER@$VPS_HOST:/opt/cocoashield/"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd /opt/cocoashield && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"

      # `up -d` réussit dès que Docker a lancé les conteneurs, même si l'API
      # redémarre en boucle derrière. Sans cette vérification, un déploiement
      # peut être vert avec la production à terre.
      - name: Verify the API answers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          cd /opt/cocoashield
          DOMAIN=$(grep '^DOMAIN=' .env | cut -d= -f2)
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/v1/audit" || echo 000)
            if [ "$code" = "401" ]; then
              echo "API en ligne : /v1/audit répond 401 sans session, comme attendu."
              exit 0
            fi
            echo "  tentative $attempt : $code"
            sleep 5
          done
          echo "L'API ne répond pas correctement après 120s."
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail 40 back
          exit 1
          REMOTE
