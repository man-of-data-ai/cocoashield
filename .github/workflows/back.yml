name: back

on:
  push:
    branches: [main, develop]
    paths:
      - "back/**"
      - "deploy/**"
      - ".github/workflows/back.yml"
  workflow_dispatch:

concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # filter + sparse-checkout : évite de télécharger les binaires de model/
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            back
            deploy
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-back
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: deploy
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy/Caddyfile "$VPS_USER@$VPS_HOST:/opt/cocoashield/"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd /opt/cocoashield && docker compose -f docker-compose.prod.yml pull back && docker compose -f docker-compose.prod.yml up -d"
