name: back

# CI de develop : construit et pousse l'image (taguée par SHA) quand le
# backend change. Le déploiement en production est géré par deploy.yml.
on:
  push:
    branches: [develop]
    paths:
      - "back/**"
      - ".github/workflows/back.yml"
  workflow_dispatch:

concurrency:
  group: back-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # filter + sparse-checkout : évite de télécharger les binaires de model/
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: back
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-back
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          # Cache sur GHCR plutôt que type=gha : le cache Actions n'est pas
          # lisible depuis une branche sœur, donc le build de production ne
          # retrouvait jamais celui chauffé par develop.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-back:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-back:buildcache,mode=max,ignore-error=true
