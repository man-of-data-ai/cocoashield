services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cocoashield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocoashield}
      POSTGRES_DB: ${POSTGRES_DB:-cocoashield}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cocoashield}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
