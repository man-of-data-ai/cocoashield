# Environnement de développement.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Le code source est monté en volume : les modifications sont prises en compte
# à chaud (nest --watch côté back, Turbopack côté web).
#
# Les dépendances se mettent à jour toutes seules : l'entrypoint compare le
# `package-lock.json` monté à celui utilisé lors du dernier démarrage et
# rejoue `npm install` s'il a changé. Ajouter une dépendance ou changer de
# branche ne demande donc pas de reconstruire l'image.

services:
  postgres:
    ports:
      - "${DATABASE_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  back:
    build:
      target: development
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Le code du dépôt écrase l'image…
      - ./back:/app
      # …sauf node_modules, qui reste celui de l'image : les binaires natifs
      # compilés dans l'image ne sont pas ceux de la machine hôte.
      - back_node_modules:/app/node_modules
      - uploads_data:/app/uploads

  web:
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports:
      - "3002:3002"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next

volumes:
  back_node_modules:
  web_node_modules:
  web_next_cache:
